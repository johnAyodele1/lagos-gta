name: Validate imported 3D assets

on:
  workflow_dispatch:
  push:
    branches:
      - feat/yaba-world-legal-driving-mobile
    paths:
      - tools/inspect_glb_assets.py
      - assets/models/characters/ara/*.glb
      - assets/models/architecture/*.glb
      - .github/workflows/validate-3d-assets.yml

permissions:
  contents: write

concurrency:
  group: yaba-3d-asset-validation
  cancel-in-progress: true

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inspect GLB geometry, rigs, animations and materials
        run: python tools/inspect_glb_assets.py

      - name: Commit verified asset manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/asset_manifest.json
          if git diff --cached --quiet; then
            echo "Asset manifest is unchanged."
            exit 0
          fi
          git commit -m "assets: record validated GLB model metadata"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "Unable to publish asset manifest after three attempts."
          exit 1
