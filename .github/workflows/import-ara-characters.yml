name: Import realistic Lagos characters

on:
  workflow_dispatch:
  push:
    branches:
      - feat/yaba-world-legal-driving-mobile
    paths:
      - assets/models/characters/ara-params/lagos-female-civilian.json
      - .github/workflows/import-ara-characters.yml

permissions:
  contents: write

concurrency:
  group: yaba-ara-characters
  cancel-in-progress: true

jobs:
  build-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Lagos GTA feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout pinned Ara 3D Gen character builder
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          ref: 2e5724de1b12444bf0c2454555fedfc976a4274c
          path: ara-tool

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build CC0 MakeHuman character data
        working-directory: ara-tool
        run: |
          npm ci
          npm run setup-assets

      - name: Export Lagos civilian, female civilian, FRSC and police models
        shell: bash
        run: |
          set -euo pipefail
          OUT="assets/models/characters/ara"
          mkdir -p "$OUT"

          export_character() {
            local output_name="$1"
            shift
            rm -f "$OUT"/*.glb
            (cd ara-tool && npm run export -- "$@" --detail low --formats glb --out "../$OUT")
            local source
            source="$(find "$OUT" -maxdepth 1 -type f -name '*.glb' -print -quit)"
            test -n "$source"
            mv "$source" "$OUT/$output_name"
          }

          export_character "lagos_male_civilian.glb" --preset "The Gangster"
          export_character "lagos_frsc_officer.glb" --preset "The FRSC Officer (Nigeria)"
          export_character "lagos_police_officer.glb" --preset "The Police Officer (Nigeria)"
          export_character "lagos_female_civilian.glb" --params "../assets/models/characters/ara-params/lagos-female-civilian.json"

          python - <<'PY'
          from pathlib import Path
          for path in sorted(Path("assets/models/characters/ara").glob("*.glb")):
              data = path.read_bytes()
              if len(data) < 20 or data[:4] != b"glTF":
                  raise SystemExit(f"Invalid GLB: {path}")
              if len(data) > 90 * 1024 * 1024:
                  raise SystemExit(f"GLB exceeds GitHub's 90 MiB budget: {path}")
              print(f"{path}: {len(data):,} bytes")
          PY
          rm -rf ara-tool

      - name: Commit character assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/characters/ara
          if git diff --cached --quiet; then
            echo "Character assets are unchanged."
            exit 0
          fi
          git commit -m "assets: import rigged Lagos human characters"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "Unable to publish character assets after three attempts."
          exit 1
