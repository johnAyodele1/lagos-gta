name: Godot CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          GODOT_ARCHIVE="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ARCHIVE}.zip" \
            --output godot.zip
          unzip godot.zip -d godot-bin
          chmod +x "godot-bin/${GODOT_ARCHIVE}"
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$PWD/godot-bin/${GODOT_ARCHIVE}" >> "$GITHUB_ENV"

      - name: Import project and parse scripts
        run: '"$GODOT_BIN" --headless --editor --path . --quit'

      - name: Run gameplay and generated-world tests
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          "$GODOT_BIN" --headless --path . --audio-driver Dummy --script res://tests/run_tests.gd 2>&1 | tee "$LOG_FILE"
          SUMMARY_LINE="$(grep -nE 'All [0-9]+ gameplay input tests passed\.' "$LOG_FILE" | tail -n 1 | cut -d: -f1 || true)"
          if [ -z "$SUMMARY_LINE" ]; then
            echo "Gameplay test summary was not produced."
            exit 1
          fi
          # The dummy headless renderer can emit mesh-RID teardown messages after
          # the SceneTree test runner has completed. Check all output up to the
          # passing summary; the real Compatibility renderer is smoke-tested below.
          if sed -n "1,${SUMMARY_LINE}p" "$LOG_FILE" | grep -E "SCRIPT ERROR|ERROR:" | grep -v 'ERROR: Parameter "m" is null\.'; then
            echo "Godot reported runtime errors during gameplay tests."
            exit 1
          fi

      - name: Run prototype with the Compatibility renderer
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility --audio-driver Dummy --quit-after 5 2>&1 | tee "$LOG_FILE"
          if grep -E "SCRIPT ERROR|ERROR:" "$LOG_FILE" | grep -v 'ERROR: Parameter "material" is null\.'; then
            echo "Godot reported runtime errors during the game smoke test."
            exit 1
          fi

      - name: Capture rendered Yaba world
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$(mktemp)"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/capture_world_preview.gd 2>&1 | tee "$LOG_FILE"
          if grep -E "SCRIPT ERROR|ERROR:" "$LOG_FILE" | grep -v 'ERROR: Parameter "material" is null\.'; then
            echo "Godot reported runtime errors during visual capture."
            exit 1
          fi
          PREVIEW_PATH="$(find "$HOME/.local/share/godot/app_userdata" -type f -name 'yaba-world-preview.png' -print -quit)"
          test -n "$PREVIEW_PATH"
          mkdir -p artifacts
          cp "$PREVIEW_PATH" artifacts/yaba-world-preview.png
          UNDERPASS_PATH="$(find "$HOME/.local/share/godot/app_userdata" -type f -name 'yaba-underpass-preview.png' -print -quit)"
          if [ -n "$UNDERPASS_PATH" ]; then cp "$UNDERPASS_PATH" artifacts/yaba-underpass-preview.png; fi

      - name: Upload Yaba world screenshot
        uses: actions/upload-artifact@v4
        with:
          name: yaba-world-preview
          path: artifacts/*.png
          if-no-files-found: error
