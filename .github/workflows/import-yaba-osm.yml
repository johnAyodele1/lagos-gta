name: Import Yaba OpenStreetMap geometry

on:
  push:
    branches:
      - feat/yaba-world-legal-driving-mobile
      - feat/polyhaven-lagos-underpass
    paths:
      - tools/fetch_yaba_osm.py
      - tools/enrich_yaba_buildings.py
      - tools/test_enrich_yaba_buildings.py
      - data/osm/yaba.overpassql
      - .github/workflows/import-yaba-osm.yml

permissions:
  contents: write

concurrency:
  group: yaba-osm-import
  cancel-in-progress: true

jobs:
  import-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test OSM normalization without network access
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Install DuckDB for cloud Parquet queries
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1

      - name: Fetch and normalize Yaba OSM geometry
        run: python tools/fetch_yaba_osm.py --output assets/data/yaba_osm.json

      - name: Enrich mapped building heights and occupancy from OpenBuildingMap
        run: python tools/enrich_yaba_buildings.py --input assets/data/yaba_osm.json

      - name: Commit generated map data to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/yaba_osm.json
          if git diff --cached --quiet; then
            echo "Yaba OSM extract is unchanged."
            exit 0
          fi
          git commit -m "data: import Yaba OpenStreetMap geometry"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          echo "Unable to publish the refreshed OSM extract after three attempts."
          exit 1
