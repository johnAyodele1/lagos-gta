name: Import Yaba OpenStreetMap geometry

on:
  push:
    branches:
      - feat/yaba-world-legal-driving-mobile
    paths:
      - tools/fetch_yaba_osm.py
      - data/osm/yaba.overpassql

permissions:
  contents: write

concurrency:
  group: yaba-osm-import
  cancel-in-progress: false

jobs:
  import-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test OSM normalization without network access
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Fetch and normalize Yaba OSM geometry
        run: python tools/fetch_yaba_osm.py --output assets/data/yaba_osm.json

      - name: Commit generated map data to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/yaba_osm.json
          if git diff --cached --quiet; then
            echo "Yaba OSM extract is unchanged."
            exit 0
          fi
          git commit -m "data: import Yaba OpenStreetMap geometry"
          git push origin "HEAD:${GITHUB_REF_NAME}"
